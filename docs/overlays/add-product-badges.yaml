overlay: 1.1.0
info:
  title: Add API product badges
  version: 1.0.0
extends: ./openapi.json
actions:
  - target: "$.paths[*][?@.tags[?@ == 'Community'] && @.tags[?@ == 'Enterprise']]"
    update:
      x-mint:
        content: '<img noZoom src="/assets/enterprise-AND-community-edition-pill-tag.svg" alt="Applies to BloodHound Enterprise and CE" />'
  - target: "$.paths[*][?@.tags[?@ == 'Enterprise'] && !@.tags[?@ == 'Community']]"
    update:
      x-mint:
        content: '<img noZoom src="/assets/enterprise-edition-pill-tag.svg" alt="Applies to BloodHound Enterprise" />'
