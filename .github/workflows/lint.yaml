name: Validation

on:
  pull_request:
    paths:
      - "docs/**"
      - ".remarkrc.mjs"
      - ".remarkrc.shared.mjs"
      - ".remarkignore"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/lint.yaml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      # Installs the exact dependency versions from package-lock.json for a repeatable CI run.
      # --ignore-scripts prevents dependencies' install-time scripts from running, reducing
      # supply-chain attack surface (e.g. a compromised package exfiltrating CI secrets).
      - run: npm ci --ignore-scripts

      # Informational during rollout: this reports the legacy backlog,
      # but does not block the PR.
      - name: Audit all documentation
        run: npm run lint:docs
        continue-on-error: true

      # Blocking: new pages must follow the lint rules from the start.
      - name: Lint new documentation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          mapfile -d '' changed_files < <(
            git diff --name-only -z --diff-filter=A \
              "${BASE_SHA}...HEAD" -- docs/
          )

          files=()
          for file in "${changed_files[@]}"; do
            case "$file" in
              *.md|*.mdx) files+=("$file") ;;
            esac
          done

          if (( ${#files[@]} == 0 )); then
            echo "No new Markdown or MDX pages to lint."
            exit 0
          fi

          npx remark --frail --silently-ignore --no-stdout "${files[@]}"
